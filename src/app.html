<!DOCTYPE html>
<html lang="%lang%">
    <head>
        <script>
            const theme = localStorage.getItem("theme") || "dark";
            if (theme === "light") {
                document.documentElement.classList.remove("dark");
            } else if (theme === "dark") {
                document.documentElement.classList.add("dark");
            } else if (theme === "auto") {
                if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.classList.add("dark");
                } else {
                    document.documentElement.classList.add("light");
                }
            }
        </script>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="any" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f8fa" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0c" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta property="twitter:domain" content="eepy.page" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
