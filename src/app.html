<!DOCTYPE html>
<html lang="%lang%">
    <head>
        <script>
            const theme = localStorage.getItem("theme") || "dark";
            if (theme === "light") {
                document.documentElement.classList.remove("dark");
            } else if (theme === "dark") {
                document.documentElement.classList.add("dark");
            } else if (theme === "auto") {
                if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.classList.add("dark");
                } else {
                    document.documentElement.classList.add("light");
                }
            }
        </script>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="any" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f8fa" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0c" />
        <meta content="eepy.page: Free Subdomains, Made Simple" property="og:title" />
        <meta property="og:type" content="website" />
        <meta
            content="A modern, completely free subdomain service for your projects. Register custom subdomains for your projects in seconds with independent DNS management and fast, reliable DNS."
            property="og:description" />
        <meta
            content="A modern, completely free subdomain service for your projects. Register custom subdomains for your projects in seconds with independent DNS management and fast, reliable DNS."
            name="description" />
        <meta content="https://www.eepy.page" property="og:url" />
        <title>Free Subdomains, Made Simple | eepy.page</title>
        <meta name="twitter:card" content="summary_large_image" />
        <meta property="twitter:domain" content="eepy.page" />
        <meta property="twitter:url" content="https://www.eepy.page" />
        <meta name="twitter:title" content="eepy.page: Free Subdomains, Made Simple" />
        <meta
            name="twitter:description"
            content="Completely free subdomain registrar service, which doesn't ask for your phone number, physical address, or identification. Get started now for free with absolutely no hassle." />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
